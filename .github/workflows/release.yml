name: Release App Lab bundle

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python sources
        run: python -m compileall -q laya_q.py model_download.py laya_runtime.py web_portal.py board_worker.py status_bridge.py app_lab/laya_status/python/main.py scripts/build_app_lab.py
      - name: Verify protocol and App Lab API
        run: python -m unittest discover -s tests -v
      - name: Build importable App Lab ZIP
        run: python scripts/build_app_lab.py Laya-Q-App-Lab.zip
      - name: Save release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Laya-Q-App-Lab-release
          path: Laya-Q-App-Lab.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi

          # Reruns finish an interrupted draft without replacing a published release.
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" == "false" ]]; then
              echo "Release $tag is already published; leaving its assets unchanged."
              exit 0
            fi
            gh release upload "$tag" Laya-Q-App-Lab.zip --clobber
          else
            gh release create "$tag" Laya-Q-App-Lab.zip \
              --target "$GITHUB_SHA" \
              --title "Laya Q $tag" \
              --generate-notes --draft
          fi
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
